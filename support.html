<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MarkTrail Support</title>
    <style>
        :root {
            --bg: #f5f7f0;
            --card: #ffffff;
            --line: #e0ddd0;
            --text: #242a24;
            --sub: #616960;
            --accent: #cc9433;
            --celadon: #6b9385;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 500px at 10% -10%, #e4ede4 0%, transparent 55%),
                        radial-gradient(900px 420px at 95% 10%, #fbf1dd 0%, transparent 60%),
                        var(--bg);
            padding: 20px;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 16px 36px rgba(60, 70, 55, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: var(--celadon);
        }

        .sub {
            margin: 0 0 18px;
            color: var(--sub);
            line-height: 1.5;
        }

        .section {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
            background: #fbfcf9;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 17px;
            color: #4a5c4e;
        }

        p, li {
            margin: 0;
            line-height: 1.6;
        }

        ul {
            margin: 8px 0 0;
            padding-left: 18px;
        }

        a {
            color: var(--accent);
            text-underline-offset: 2px;
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: var(--sub);
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>MarkTrail Support</h1>
        <p class="sub">문의, 오류 제보는 아래 경로로 접수해 주세요.</p>

        <section class="section">
            <h2>연락처</h2>
            <p>Email: <a href="mailto:mall77@naver.com?subject=MarkTrail%20Support">mall77@naver.com</a></p>
            <ul>
                <li>앱 버전, 기기 모델, iOS 버전, 재현 방법을 함께 보내주시면 더 빠르게 도와드릴 수 있습니다.</li>
            </ul>
        </section>

        <section class="section">
            <h2>지원 범위</h2>
            <ul>
                <li>앱 실행/레이아웃 문제</li>
                <li>유적 정보 오류 제보 (사진, 설명, 위치 등)</li>
                <li>방문 확인(GPS) 관련 문의</li>
                <li>일반 사용 문의 및 개선 제안</li>
            </ul>
        </section>

        <section class="section">
            <h2>Related Links</h2>
            <p><a href="privacy.html">Privacy Policy</a></p>
        </section>

        <p class="footer">Last updated: 2026-08-26</p>
    </main>
</body>
</html>
